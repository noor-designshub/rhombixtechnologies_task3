<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOYAGE. - Travel Booking System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-brand"><i class="fa-solid fa-plane-departure"></i> VOYAGE<span>.</span></div>
    <div class="nav-actions" id="authNav">
      <button class="btn btn-secondary" onclick="openModal('loginModal')">Login</button>
      <button class="btn btn-primary" onclick="openModal('registerModal')">Sign Up</button>
    </div>
  </nav>

  <!-- HERO SEARCH SECTION -->
  <header class="hero">
    <h1>Explore The World With Ease</h1>
    <p>Find & book flights, luxury hotels, and incredible experiences in real-time.</p>

    <div class="search-card">
      <div class="search-form">
        <div class="form-group">
          <label><i class="fa-solid fa-filter"></i> Type</label>
          <select id="searchType">
            <option value="all">All Types</option>
            <option value="flight">Flights Only</option>
            <option value="hotel">Hotels Only</option>
          </select>
        </div>

        <div class="form-group">
          <label><i class="fa-solid fa-location-dot"></i> Destination</label>
          <input type="text" id="searchLocation" placeholder="e.g. London, Paris, Dubai">
        </div>

        <button class="btn btn-primary btn-search" onclick="executeSearch()">
          <i class="fa-solid fa-magnifying-glass"></i> Search
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="main-container">
    
    <!-- LISTINGS GRID -->
    <section class="section">
      <h2 class="section-title">Available Listings</h2>
      <div class="listings-grid" id="listingsGrid">
        <!-- Rendered via JS -->
      </div>
    </section>

    <!-- BOOKING HISTORY (AUTHORIZED ONLY) -->
    <section class="section" id="historySection" style="display: none;">
      <h2 class="section-title">My Bookings History</h2>
      <div class="table-card">
        <table class="history-table">
          <thead>
            <tr>
              <th>Booking</th>
              <th>Type</th>
              <th>Date</th>
              <th>Amount</th>
              <th>Payment Status</th>
            </tr>
          </thead>
          <tbody id="historyTableBody"></tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- REGISTER MODAL -->
  <div class="modal-overlay" id="registerModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Create Account</h2>
        <i class="fa-solid fa-xmark modal-close" onclick="closeModal('registerModal')"></i>
      </div>
      <form id="registerForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="regName" required placeholder="John Doe">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="regEmail" required placeholder="john@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPassword" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary full-width">Sign Up</button>
      </form>
    </div>
  </div>

  <!-- LOGIN MODAL -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal">
      <div class="modal-header">
        <h2>User Login</h2>
        <i class="fa-solid fa-xmark modal-close" onclick="closeModal('loginModal')"></i>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="loginEmail" required placeholder="john@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary full-width">Login</button>
      </form>
    </div>
  </div>

  <!-- BOOKING & PAYMENT MODAL -->
  <div class="modal-overlay" id="checkoutModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Confirm Reservation & Payment</h2>
        <i class="fa-solid fa-xmark modal-close" onclick="closeModal('checkoutModal')"></i>
      </div>
      <form id="checkoutForm">
        <input type="hidden" id="checkoutListingId">
        <input type="hidden" id="checkoutPrice">

        <div class="form-group">
          <label>Selected Item</label>
          <input type="text" id="checkoutTitle" readonly>
        </div>
        <div class="form-group">
          <label>Travel / Check-in Date</label>
          <input type="date" id="checkoutDate" required>
        </div>
        <div class="form-group">
          <label>Card Number (Payment Simulation)</label>
          <input type="text" id="cardNumber" required placeholder="4242 4242 4242 4242">
        </div>
        <div class="checkout-summary">
          <span>Total Amount:</span>
          <strong id="checkoutTotal">$0</strong>
        </div>
        <button type="submit" class="btn btn-primary full-width">Pay & Confirm Booking</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
